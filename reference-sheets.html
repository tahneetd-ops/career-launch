Dev\n$110k+", "color": "#8b5cf6"}], "careers": ["Front-End Developer", "UX Designer", "Data Analyst", "Full-Stack Developer", "QA Engineer", "Cybersecurity Analyst"], "statBoxes": [{"val": "~$15k", "lbl": "Avg Cost / Debt", "color": "var(--gold)"}, {"val": "3–6 Months", "lbl": "Program Length", "color": "var(--blue)"}, {"val": "$58,000", "lbl": "Avg Starting Salary", "color": "var(--gold)"}, {"val": "6 months", "lbl": "Fastest to First Job", "color": "var(--green)"}]}, {"name": "Military Service", "emoji": "🎖️", "tagline": "Earn, train, and get paid — then transition to civilian careers", "totalCost": "$0", "costNote": "You are PAID to serve. GI Bill covers college afterward. Benefits include housing, healthcare, and food.", "startAge": 18, "debtAvg": 0, "startingSalary": 24000, "avgSalary": 55000, "timeToJob": "Immediate (enlisted at 18)", "growthRate": 0.05, "pros": ["Zero cost — you earn a salary while serving", "GI Bill pays for college or trade school after service", "Full healthcare, housing, and food provided", "Structured career path with guaranteed advancement"], "cons": ["High personal risk — deployment to combat zones", "Long commitment (4+ years enlisted)", "Military culture is not for everyone", "Transitioning to civilian jobs can be challenging"], "timeline": [{"year": "Age 18", "label": "Enlist\n$24k + benefits", "color": "#22c55e"}, {"year": "Year 1–4+", "label": "Serve\nFree housing", "color": "#16a34a"}, {"year": "After Service", "label": "GI Bill\nFree college", "color": "#3b82f6"}, {"year": "Age 26+", "label": "Civilian\nCareer", "color": "#0ec9b5"}], "careers": ["Any — the GI Bill funds most paths", "Cybersecurity", "Engineering", "Healthcare", "Law Enforcement", "Logistics", "Leadership / Management"], "statBoxes": [{"val": "$0", "lbl": "Total Cost", "color": "var(--green)"}, {"val": "4+ Years", "lbl": "Service Commitment", "color": "var(--coral)"}, {"val": "$24k+", "lbl": "Starting Pay + Benefits", "color": "var(--gold)"}, {"val": "Free", "lbl": "College via GI Bill", "color": "var(--green)"}]}, {"name": "Self-Taught / Freelance", "emoji": "🌐", "tagline": "Build your own path — requires extreme discipline", "totalCost": "$0 – $3,000", "costNote": "YouTube, free courses, personal projects. Cost is mostly time and discipline.", "startAge": 18, "debtAvg": 0, "startingSalary": 25000, "avgSalary": 60000, "timeToJob": "1–3 years (variable)", "growthRate": 0.07, "pros": ["Zero formal debt", "Maximum flexibility — work on anything, anywhere", "Portfolio speaks louder than a degree in some fields", "Can earn while learning (freelance gigs)"], "cons": ["No structure — most people fail without accountability", "Very slow income growth at first", "Many employers still require degrees", "Requires extraordinary self-motivation and consistency"], "timeline": [{"year": "Year 1–2", "label": "Learn + Build\nPortfolio", "color": "#ec4899"}, {"year": "Year 1–3", "label": "Freelance gigs\n$0–$30k", "color": "#f59e0b"}, {"year": "Year 3+", "label": "Full-time job\nor freelance", "color": "#22c55e"}, {"year": "Year 5+", "label": "Variable\n$40–100k+", "color": "#8b5cf6"}], "careers": ["Graphic Designer", "Web Developer", "Writer / Content Creator", "Photographer", "Video Editor", "Social Media Manager", "Illustrator"], "statBoxes": [{"val": "~$0", "lbl": "Formal Debt", "color": "var(--green)"}, {"val": "Variable", "lbl": "Time to Income", "color": "var(--pink)"}, {"val": "$25,000", "lbl": "Avg Year 1 Income", "color": "var(--muted)"}, {"val": "High Risk", "lbl": "Without Discipline", "color": "var(--red)"}]}], "myths": [{"myth": "You NEED a 4-year degree to get a good-paying job.", "bust": "<strong>False — and the data is clear.</strong> Trade school graduates like electricians and plumbers regularly earn $60,000–$80,000/year with <em>zero student debt</em>. A Wisconsin electrician with 5 years of experience often earns more than a teacher with a bachelor's degree — and started earning 4 years earlier. The idea that everyone needs college was created when college was cheap. Today it's a major financial decision that needs to be evaluated for each specific career path.", "stat": "Plumbers and electricians earn $55k–$85k avg with no college degree"}, {"myth": "A college degree always pays off in the long run.", "bust": "<strong>Sometimes — but not always.</strong> The math depends entirely on your major, your school, and your career. A nursing degree from a state school paying $50k total? Strong investment. An art history degree from a private school costing $180k? The numbers often don't add up. Before choosing a college, you must research: average starting salary for your specific major, total cost of that school, and how long it will take to pay off the debt. <em>Degree + wrong major + expensive school = financial hole that takes a decade to climb out of.</em>", "stat": "Only 27% of college grads work in a job related to their major"}, {"myth": "Trade school is for people who aren't smart enough for college.", "bust": "<strong>This is one of the most harmful myths in American education.</strong> Trade workers are problem-solvers who need to understand electrical systems, plumbing codes, building physics, and customer service simultaneously. Many trade workers out-earn college graduates and retire with more wealth. The stigma attached to trades is a cultural bias — not a reflection of intelligence, difficulty, or value. The fact that trades are \"undervalued\" is exactly why they pay well: not enough people go into them.", "stat": "47% of skilled trades jobs go unfilled due to worker shortages"}, {"myth": "You can't succeed without a college education.", "bust": "<strong>Some of the most successful people in history didn't finish college.</strong> More importantly, success in most fields comes from skills, portfolio, and relationships — not a piece of paper. Bootcamp grads get hired at top tech companies. Self-taught designers work for major brands. Military veterans become CEOs. What matters is: can you do the work? For many careers, a strong portfolio or demonstrated skill set is worth more than a diploma. That said, certain fields (medicine, law, licensed engineering) legally require specific credentials.", "stat": "Apple, Google, and IBM no longer require college degrees for many roles"}, {"myth": "Student debt is just a normal part of life — everyone has it.", "bust": "<strong>It's common, but it's not inevitable — and it's not harmless.</strong> The average student loan payment is $400–$500/month for 10–20 years. That's $4,800–$6,000/year that could be going into savings, a house down payment, or investments. Over 20 years, someone with zero student debt who invests $500/month at 7% return accumulates <strong>over $260,000</strong>. Student debt isn't \"normal\" — it's a specific financial decision that has real long-term consequences. Some paths are worth it. Some aren't. Know the difference before you sign.", "stat": "$500/month invested for 20 years at 7% return = $260,000+"}, {"myth": "Military service is only for people with no other options.", "bust": "<strong>This couldn't be more wrong.</strong> The military offers immediate income, housing, food, healthcare, structured career advancement, and — when you leave — the GI Bill pays for college or trade school. Many people intentionally choose the military <em>first</em> as a financial strategy: serve 4 years, save money, get the GI Bill, and then go to college for free. It's one of the few education paths with zero net cost. It's not the right choice for everyone — but it's a financially sophisticated option that's dramatically underconsidered.", "stat": "GI Bill pays up to $27,000/year for college — fully funded"}], "pathCosts": {"4year": {"cost": 50000, "debt": 37000, "startDelay": 4, "startMult": 1}, "community": {"cost": 12000, "debt": 8000, "startDelay": 2, "startMult": 0.85}, "trade": {"cost": 8000, "debt": 2000, "startDelay": 2, "startMult": 0.88}, "bootcamp": {"cost": 15000, "debt": 15000, "startDelay": 0.5, "startMult": 1.05}, "military": {"cost": 0, "debt": 0, "startDelay": 0, "startMult": 0.55}, "selftaught": {"cost": 1000, "debt": 0, "startDelay": 1.5, "startMult": 0.65}}}},H={"values": ["The Values Card Sort has <b>4 steps</b>: ① Sort the Cards, ② Rank Your Yeses, ③ Reflect &amp; Discuss, ④ Your Values Profile.", "Step 1: tap ✓ Yes if a value matters a lot, ✗ No if it doesn't, or ? Maybe if you're not sure.", "Step 2 is called <b>Rank Your Yeses</b>. Use the ▲ ▼ arrows to put your #1 value on top.", "Big idea: two people can want opposite things from a career and <b>both be right</b>. Values are personal.", "A mismatch between your values and your career is one of the leading causes of <b>job unhappiness, even in high-paying jobs</b>.", "Your values can change as you grow. Noticing what drives you is a career superpower."], "tabs": {"clusters": {"head": "How the 16 Career Clusters Challenge works", "points": ["The game gives you a job title and you pick which of the <b>16 career clusters</b> it belongs to.", "Tip: ask yourself <i>what does this person mainly do all day?</i> Heal people? Build things? Move things? Work with money?", "Some jobs could fit two clusters. Pick the one that matches the job's <b>main purpose</b>."], "talk": ["Which job surprised you the most? Why?", "Which cluster did you get wrong at first, and what clue would have helped?"], "table": {"head": "Jobs from the challenge and their clusters", "cols": ["Job", "Cluster"], "rows": [["Epidemiologist", "Health Science"], ["UX Designer", "Information Technology"], ["Sommelier", "Hospitality &amp; Tourism"], ["Forensic Accountant", "Finance"], ["Drone Operator", "Transportation"], ["Biomedical Engineer", "Health Science"], ["Game Warden", "Agriculture &amp; Natural Resources"], ["Paralegal", "Law &amp; Public Safety"], ["Brand Strategist", "Marketing"], ["Robotics Technician", "Manufacturing"], ["Urban Planner", "Architecture &amp; Construction"], ["Documentary Filmmaker", "Arts &amp; Communications"], ["Actuary", "Finance"], ["Occupational Therapist", "Health Science"], ["Campaign Manager", "Government &amp; Public Administration"], ["Supply Chain Analyst", "Transportation"], ["Esports Coach", "Education &amp; Training"], ["Cybersecurity Analyst", "Information Technology"], ["Child Protective Services Worker", "Human Services"]]}}, "dossier": {"head": "C.A.R.E.E.R. Agent Dossier facts", "points": ["The dossier has <b>6 sections</b>: Agent Identity, Target Cluster, Strengths Intel, Soft Skills Rating, Mission Brief, Field Notes.", "Soft skills are rated with stars. <b>1 star = still developing, 5 stars = one of your best</b>. 5 stars is the highest.", "The 6 soft skills you rate are Communication, Teamwork, Problem-Solving, Responsibility, Positive Attitude and Integrity. <b>Creativity is not one of the 6.</b>", "For your cluster there is a choice for students who haven't decided: <b>Not Sure Yet</b>.", "Your lowest-rated skill is an opportunity for growth, not a flaw. Be honest.", "Interview prep questions: Tell me about yourself; What is your greatest strength; Why do you want this job; Tell me about a challenge you faced. Good candidates also ask a question.", "When you finish, the app says <b>'Cleared for Mission'</b>."], "talk": ["Which soft skill did you rate lowest? What is one way to practice it?", "What do you do when you feel nervous? What helps you feel confident?"]}, "sticky": {"head": "Dream Job Sticky Wall facts", "points": ["The three counters at the top: <b>Dream Jobs Posted, Different Clusters, Changed Their Mind</b>.", "You post your dream job on Day 1. You <b>revisit it at the end of the semester</b>.", "When you revisit: <b>look at what you posted on Day 1 and see if anything changed</b>.", "If you're not sure which cluster your job fits, choose <b>Not Sure Yet</b>.", "To post you give: name, dream job, cluster (best guess), why this job, and a sticky color."], "talk": ["Why is it okay if your dream job changes?", "What is one thing you already know about your dream job?"]}, "info": {"head": "Informational Interview facts", "points": ["An informational interview is a conversation <b>YOU</b> ask for with someone who works in a career you're curious about. <b>No job is being offered.</b>", "Typical length: informational interview <b>20–30 minutes</b>. Job interview <b>30–60 minutes</b>.", "Up to <b>70–80%</b> of jobs are filled through networking, not job postings.", "You set up the meeting, ask the questions, take notes, and <b>send a thank-you afterward</b>.", "Asking for an informational interview is a soft skill called <b>initiative</b>. The worst they can say is <b>'no' or 'not right now'</b>.", "Build a set of <b>5–7</b> questions for a real 20-minute talk.", "Partner practice: one is the Student, one is the Professional. <b>Switch roles after 3–4 questions.</b>", "Question to ask: <b>What does a typical day or week look like in your role?</b> Movies lie about what jobs look like, so this gives the real picture.", "Question to ask: <b>What would you do differently if you were starting over today?</b> This is pure hindsight advice."], "talk": ["Which career would you most like to interview someone about?", "Which question would you ask first, and why?"]}, "elev": {"head": "Elevator Pitch facts", "points": ["The pitch has <b>4 parts</b>: ① Who You Are, ② <b>Your Strengths</b>, ③ Your Direction, ④ Your Closing Hook.", "Name <b>1–2 strengths</b> and back at least one up with a real example.", "Saying <b>'I have no idea'</b> is not a pitch. It's okay to be exploring, but say it with intention.", "The closing hook should <b>make the person want to keep talking to you</b>.", "Spoken pitch length: <b>30–45 seconds</b>. The delivery timer in the app is <b>30 seconds</b>.", "Delivery checklist: instead of saying 'um' or 'like', <b>pause</b>. Eye contact: <b>look at the person, not the floor</b>. Voice: <b>confident, not apologetic</b>.", "Strong example: Darius fixed <b>the school's projector</b> during a presentation. He explored Information Technology, especially cybersecurity."], "talk": ["Which part of the pitch is hardest to write?", "Say your hook out loud to a partner. Does it make them curious?"]}}, "extra": {"soft": ["When you accidentally email confidential information to the wrong client, <b>telling your boss right away</b> shows integrity.", "The <b>sunk cost trap</b> means <b>sticking with a bad plan because you already spent time on it</b>. Good problem-solvers pivot early."], "mock": ["The app's question categories are About You, Strengths &amp; Skills, Problem-Solving, Teamwork, Goals &amp; Future, and Curveball. <b>Hobbies &amp; Sports is not a category.</b>", "Teammate not doing their fair share: <b>talk to them directly and stay calm</b>, privately and respectfully.", "'Do you prefer working alone or in a group?': <b>there is no perfect answer. Be honest. Most employers want people who can do both.</b>"], "pathway": ["Therapists and counselors can specialize in physical OR emotional healing. These are <b>two very different fields that both take patience, empathy, and years of training</b>."], "col": ["Experts say spend <b>no more than 30%</b> of your GROSS (before-tax) income on rent.", "Nurse example: $62,000 a year is $5,167 a month gross. Rent of $1,800 is 35% of gross and about <b>46% of take-home pay</b> (take-home about $3,900).", "A doctor with $300,000 in loans at 6% over 20 years pays about <b>$2,150 a month</b>.", "Living 'the American Dream' takes about <b>$90,000 a year</b>.", "A $50,000 salary comes to about <b>$3,300 a month after taxes</b>."], "mad": ["The five stories are about five careers. <b>Airline Pilot is not one of them.</b>", "Developer debrief: coding languages are tools. The real skill underneath them all is <b>thinking logically and breaking problems into steps</b>."], "values": ["A mismatch between values and career is a leading cause of <b>job unhappiness, even in high-paying jobs</b>.", "Can two people want opposite things and both be right? <b>Yes. Both are right for themselves.</b>"], "elev": ["Strengths: name <b>1–2 strengths and back one up with a real example</b>.", "Your voice should sound <b>confident, not apologetic</b>."], "budget": ["Housing is about <b>30%</b> of your take-home pay.", "The average car payment is <b>$700 a month</b> (the spinner shows your weekly share)."], "edcost": ["A Wisconsin public 4-year university totals about <b>$50,000</b>.", "Community college typically costs about <b>$12,000</b> in total.", "Plumbers and electricians earn <b>$55k–$85k on average with no college degree</b>.", "Only <b>27%</b> of college grads work in a job related to their major."]}};
const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const list=a=>(a||[]).map(esc).join(', ');
function table(head,rows){return '<table><thead><tr>'+head.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr class="blk">'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table>';}
const talk=a=>'<div class="talk blk"><b>💬 Talk about it with a partner</b><ul>'+a.map(x=>'<li>'+x+'</li>').join('')+'</ul></div>';
const how='<div class="how">Explore the app first and have fun. Then use this sheet to answer your Google Form. The answers are all on this page.</div>';
const pts=a=>'<ul>'+a.map(p=>'<li class="blk">'+p+'</li>').join('')+'</ul>';
const R={};
R.matchmaker=()=>{const m=D.Matchmaker;let h=how+talk(['Did your #1 cluster surprise you?','Which of the 5 questions pushed you toward it?','Which cluster at the bottom of your list would you still like to explore?']);
 h+='<h2>The quiz</h2><p>There are <b>16 career clusters</b>. The quiz asks <b>5 questions</b>, and every answer points toward one or more clusters.</p>'+table(['Question','Answer choices'],m.questions.map(q=>['<b>'+esc(q.text)+'</b>',q.options.map(o=>esc(o.text)).join('<br>')]));
 h+='<h2>All 16 clusters</h2>'+table(['Cluster','What it is','Salary range','Real jobs'],Object.entries(m.clusterData).map(([n,c])=>['<b>'+esc(n)+'</b>',esc(c.desc),'<b>'+esc(c.salary)+'</b>',list(c.jobs)]));return h;};
R.soft=()=>{const m=D.SoftSkills;let h=how+talk(['Which soft skill is hardest for you?','When has a teammate shown great integrity?','What would YOU do if the printer broke 10 minutes before a presentation?']);
 h+='<h2>The 6 soft skills</h2>'+table(['Skill','What it means','Examples'],m.skillCategories.map(s=>['<b>'+esc(s.name)+'</b>',esc(s.def),esc(s.examples)]));
 h+='<h2>The '+m.scenarios.length+' scenarios</h2><p class="small">Which skill is each one testing? What does the app say to do?</p>'+table(['Skill','Scenario','What to do (the tip)','Fact from the app'],m.scenarios.map(s=>['<b>'+esc(s.answer)+'</b>',esc(s.text),esc(s.tip),esc(s.stat)]));return h;};
R.strength=()=>{const m=D.Strength;let h=how+talk(['Which strengths did you pick? Which one do your friends see in you?','Which career connection surprised you?','After you pick your strengths, press the <b>Build My Strength Profile</b> button to see your profile.']);
 m.categories.forEach(c=>{h+='<h2>'+esc(c.name)+'</h2><p class="small">'+esc(c.desc)+'</p>'+table(['Strength','What it means','Careers it connects to'],c.strengths.map(s=>['<b>'+esc(s.name)+'</b>',esc(s.def),esc(s.careers)]));});return h;};
R.mock=()=>{const m=D.MockInterview;let h=how+talk(['Which question would make you the most nervous?','Which tip will you remember for a real interview?']);
 h+='<p>There are <b>'+m.categories.length+' categories</b> of interview questions: '+m.categories.map(c=>'<b>'+esc(c.name)+'</b>').join(', ')+'.</p>';
 m.categories.forEach(c=>{h+='<h2>'+esc(c.name)+'</h2>'+table(['Question','The app\'s tip'],m.questions.filter(q=>q.cat===c.name).map(q=>['<b>'+esc(q.text)+'</b>',esc(q.tip)]));});return h;};
R.pathway=()=>{const m=D.Pathway;let h=how+talk(['Which adventure did you pick, and what choice sent you to your destination?','Which other destination would you like to try?','How did the Big Lesson change how you think about that career?']);
 h+='<h2>The '+m.adventures.length+' adventures</h2>'+table(['Adventure','What it is about'],m.adventures.map(a=>[esc(a.icon)+' <b>'+esc(a.name)+'</b>',esc(a.desc)]));
 h+='<h2>All '+Object.keys(m.destinations).length+' destinations</h2>'+table(['Destination','Salary','Education','Real jobs','Steps to get there','Big Lesson'],Object.values(m.destinations).map(d=>['<b>'+esc(d.title)+'</b><br><span class="small">'+esc(d.cluster)+'</span>','<b>'+esc(d.salary)+'</b>',esc(d.education),list(d.jobs),'<ol style="margin:0 0 0 16px;padding:0">'+(d.path||[]).map(p=>'<li>'+esc(p)+'</li>').join('')+'</ol>',esc(d.lesson)]));return h;};
R.color=()=>{const m=D.ColorQuiz;let h=how+talk(['Which trait in your color is really you? Which one is not?','Think of someone you know with a different color. How are you different?']);
 Object.values(m.colorTypes).forEach(c=>{h+='<div class="card blk"><h3 style="margin-top:0">'+esc(c.label)+' — '+esc(c.tagline)+'</h3><p>'+esc(c.desc)+'</p><p><b>Traits:</b> '+list(c.traits)+'</p><p><b>Careers that fit:</b></p><ul>'+(c.careers||[]).map(x=>'<li><b>'+esc(x.name)+'</b> — '+esc(x.why)+'</li>').join('')+'</ul></div>';});return h;};
R.wyr=()=>{const m=D.WYR;return how+talk(['Which question did the class disagree on the most?','What does your pattern of choices say about what you want from a career?'])+'<h2>All '+m.questions.length+' questions</h2>'+table(['#','Option A','Option B'],m.questions.map((q,i)=>[i+1,'<b>'+esc(q.a)+'</b><br><span class="small">'+esc(q.sa)+'</span>','<b>'+esc(q.b)+'</b><br><span class="small">'+esc(q.sb)+'</span>']));};
R.col=()=>{const m=D.CostOfLiving;return how+talk(['Which number surprised you most?','What is one thing you could do now to get ready for these costs?'])+'<h2>The '+m.questions.length+' questions and the facts behind them</h2>'+table(['Question','The answer','Why'],m.questions.map(q=>['<b>'+esc(q.headline)+'</b><br>'+esc(q.main),'<b>'+esc(q.choices[q.correct])+'</b>',esc(q.explain)]));};
R.mad=()=>{const m=D.MadLibs;let h=how+talk(['Which career would you want? Which would you not?','Which soft skill showed up in more than one career?']);Object.values(m.stories).forEach(s=>{h+='<h2>'+esc(s.name)+'</h2>'+pts(s.debrief.map(d=>esc(d.emoji)+' '+d.text));});return h;};
R.values=()=>{const m=D.Values;return how+talk(['Can two people want opposite things from a career and both be right?','Which value ended up in your Top 3, and why?'])+'<h2>The app\'s 4 steps and big ideas</h2>'+pts(H.values)+'<h2>The 16 value cards</h2>'+table(['Value card','What the card says','Careers that match'],m.values.map(v=>['<b>'+esc(v.name)+'</b>',esc(v.def),(v.careers||[]).map(c=>esc(c.n)).join(', ')]));};
R.budget=()=>{const m=D.Budget;return how+talk(['Which expense would be the hardest to give up?','What is a NEED and what is a WANT? Where is the line?'])+'<h2>The 18 expenses</h2>'+table(['Expense','% of take-home','What it is','Reality check'],m.segments.map(s=>['<b>'+esc(s.emoji)+' '+esc(s.name)+'</b>',esc(s.pctOfTakeHome)+'%',esc(s.explain),esc(s.reality)]))+'<h2>The 25 careers</h2>'+table(['Career','Starting salary','Average','Experienced'],m.careers.map(c=>['<b>'+esc(c.name)+'</b>','$'+c.start.toLocaleString(),'$'+c.avg.toLocaleString(),'$'+c.exp.toLocaleString()]));};
R.edcost=()=>{const m=D.EdCost;return how+talk(['Which path fits the career you want?','Which myth did you believe before today?'])+'<h2>The 6 paths</h2>'+table(['Path','Total cost','Avg debt','Start age','Starting salary','Avg salary','Time to first job'],m.paths.map(p=>['<b>'+esc(p.name)+'</b><br><span class="small">'+esc(p.tagline)+'</span>',esc(p.totalCost),'$'+Number(p.debtAvg).toLocaleString(),esc(p.startAge),'$'+Number(p.startingSalary).toLocaleString(),'$'+Number(p.avgSalary).toLocaleString(),esc(p.timeToJob)]))+'<h2>Myth Busters</h2>'+table(['Myth','What the data says','📊 Stat'],m.myths.map(x=>['<b>'+esc(x.myth)+'</b>',esc(x.bust),'<b>'+esc(x.stat)+'</b>']))+'<div class="how"><b>Calculator questions:</b> these need the app. Open the <b>My Calculator</b> tab, choose the settings in the question, and click Calculate &amp; Compare.</div>';};
R.hand=k=>()=>{const t=H.tabs[k];return how+talk(t.talk)+'<h2>'+esc(t.head)+'</h2>'+pts(t.points)+(t.table?'<h2>'+esc(t.table.head)+'</h2>'+table(t.table.cols,t.table.rows):'');};
const TABS=[['matchmaker','🎯 Career Cluster Matchmaker',R.matchmaker],['soft','💬 Soft Skills Scenarios',R.soft],['strength','💪 Strength Builder',R.strength],['mock','🎤 Mock Interview Spinner',R.mock],['pathway','🗺️ Career Pathway Adventure',R.pathway],['color','🎨 Personality Color Quiz',R.color],['wyr','🤔 Would You Rather',R.wyr],['col','💰 Cost of Living Quiz',R.col],['mad','😂 Career Mad Libs',R.mad],['values','🃏 Values Card Sort',R.values],['budget','💵 Weekly Budget Spinner',R.budget],['edcost','🎓 Education Cost Showdown',R.edcost],['clusters','🗂️ 16 Career Clusters Challenge',R.hand('clusters')],['dossier','🕵️ Agency Dossier',R.hand('dossier')],['sticky','📌 Dream Job Sticky Wall',R.hand('sticky')],['info','🤝 Informational Interview Builder',R.hand('info')],['elev','🚀 Elevator Pitch Builder',R.hand('elev')]];
const main=document.getElementById('main'),pick=document.getElementById('pick');
TABS.forEach(t=>{const f0=t[2];t[2]=()=>f0()+((H.extra&&H.extra[t[0]])?'<h2>More key facts</h2>'+pts(H.extra[t[0]]):'');pick.insertAdjacentHTML('beforeend','<option value="'+t[0]+'">'+t[1]+'</option>');const s=document.createElement('section');s.className='tab';s.id='tab-'+t[0];s.innerHTML='<h1>'+t[1]+' — Reference Sheet</h1>'+t[2]();main.appendChild(s);});
function show(id){if(!TABS.some(t=>t[0]===id))id=TABS[0][0];pick.value=id;document.getElementById('q').value='';apply('');document.querySelectorAll('section.tab').forEach(s=>s.classList.toggle('active',s.id==='tab-'+id));history.replaceState(null,'','#'+id);window.scrollTo&&window.scrollTo(0,0);}
function apply(q){q=q.trim().toLowerCase();document.querySelectorAll('.blk').forEach(b=>{b.style.display=(!q||b.textContent.toLowerCase().includes(q))?'':'none';});}
pick.addEventListener('change',()=>show(pick.value));document.getElementById('q').addEventListener('input',e=>apply(e.target.value));
show(location.hash.replace('#',''));
</script></body></html>
