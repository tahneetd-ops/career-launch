promising on ideas"}, {"name": "Problem-Solving", "color": "#f97316", "def": "Staying calm when something goes wrong and thinking of ways to fix it.", "examples": "Finding a new approach when the first plan fails, thinking creatively under pressure"}, {"name": "Responsibility", "color": "#f5c842", "def": "Doing what you said you'd do, showing up on time, and owning your mistakes.", "examples": "Turning in work on time, admitting when you made an error, following through"}, {"name": "Positive Attitude", "color": "#ec4899", "def": "Staying professional and upbeat even in hard situations — your attitude is contagious.", "examples": "Encouraging teammates, staying calm under pressure, finding solutions not excuses"}, {"name": "Integrity", "color": "#22c55e", "def": "Being honest and doing the right thing even when no one is watching.", "examples": "Telling the truth when you made a mistake, not taking credit for others' work"}], "scenarios": [{"cat": "Communication", "text": "Your manager asks you to explain the new project to a coworker who just joined.", "sub": "You know the project really well, but your coworker looks confused after your first explanation.", "answer": "Communication", "tip": "Great communicators check for understanding and adjust their explanation — not just repeat the same thing louder.", "stat": "Studies show 86% of workplace failures happen because of poor communication."}, {"cat": "Teamwork", "text": "Your team disagrees on which design to pick. Half want option A, half want option B.", "sub": "The deadline is in one hour and the argument is getting heated.", "answer": "Teamwork", "tip": "Good team players help the group move forward — sometimes that means proposing a compromise or taking a quick vote.", "stat": "Teams that handle disagreement well are 3x more likely to hit their goals."}, {"cat": "Problem-Solving", "text": "The printer breaks 10 minutes before you need to hand out 30 copies for your presentation.", "sub": "Your boss is already in the meeting room waiting.", "answer": "Problem-Solving", "tip": "Problem-solvers don't freeze — they think: 'What CAN I do right now?' Maybe email the file, use a screen, or summarize verbally.", "stat": "Employers rank problem-solving as the #1 most valuable skill in new hires."}, {"cat": "Responsibility", "text": "You forgot to finish an important task that was due today. Your teammate is waiting on you.", "sub": "You're hoping maybe nobody notices.", "answer": "Responsibility", "tip": "Responsible employees don't hide mistakes — they own them immediately and communicate a plan to fix it.", "stat": "Employees who admit mistakes build 40% more trust with their managers than those who hide them."}, {"cat": "Positive Attitude", "text": "Your team just found out your project got rejected. Everyone is upset and giving up.", "sub": "There's still time to revise and resubmit if you start now.", "answer": "Positive Attitude", "tip": "One person with a positive attitude can shift the whole team's energy. Saying 'Let's figure out what to fix' is more powerful than 'This is hopeless.'", "stat": "Positive team culture improves productivity by up to 31%."}, {"cat": "Integrity", "text": "You accidentally sent an email to the wrong client with confidential information.", "sub": "You could delete it and hope they don't read it — or you could tell your boss.", "answer": "Integrity", "tip": "Integrity means being honest even when it's scary. Telling your boss immediately shows you can be trusted with serious responsibilities.", "stat": "78% of employers say integrity is a dealbreaker — they won't hire someone who hides mistakes."}, {"cat": "Communication", "text": "Your coworker keeps talking over you in meetings. You have good ideas but can't get a word in.", "sub": "You've let it slide 3 times already.", "answer": "Communication", "tip": "Assertive communication means speaking up for yourself calmly and professionally — not staying silent or blowing up.", "stat": "Assertive com ion.", "answer": "Integrity", "tip": "This is a tough one — integrity means respecting confidentiality even when it's hard. Sharing could make things worse for everyone.", "stat": "Confidentiality breaches are one of the top reasons for termination in professional jobs."}, {"cat": "Communication", "text": "Your manager gives you feedback on your work that you disagree with.", "sub": "You think your approach was actually better than what she's suggesting.", "answer": "Communication", "tip": "Receiving feedback gracefully is a skill. You can disagree — but the way you respond matters more than whether you were right.", "stat": "Employees who receive feedback well advance in their careers 37% faster than those who get defensive."}, {"cat": "Teamwork", "text": "Your team wins a big award for a project. Your manager mentions everyone's name except yours.", "sub": "You contributed just as much as everyone else.", "answer": "Teamwork", "tip": "How you handle being overlooked says a lot. A team player addresses it professionally rather than sulking or causing drama.", "stat": "Feeling valued at work is the #1 predictor of employee satisfaction."}, {"cat": "Problem-Solving", "text": "A customer is upset about a mistake that wasn't your fault — it was a different department's error.", "sub": "They're yelling and demanding a refund immediately.", "answer": "Problem-Solving", "tip": "Problem-solvers focus on fixing the problem, not defending who caused it. Staying calm with an upset customer is a superpower.", "stat": "Businesses that resolve customer complaints well earn 70% more repeat customers."}, {"cat": "Responsibility", "text": "You made a mistake in a report that your boss already sent to the company president.", "sub": "You just noticed it. The meeting is in one hour.", "answer": "Responsibility", "tip": "Telling your boss immediately — even though it's embarrassing — gives the team a chance to fix it. Hiding it guarantees disaster.", "stat": "Transparent mistake-repor itics, Broadcasting, Sales"}, {"name": "Storyteller", "def": "I communicate ideas through stories people remember", "careers": "Marketing, Teaching, Film, Journalism, Ministry"}, {"name": "Clear Communicator", "def": "I explain things in ways that are easy to understand", "careers": "Teaching, Customer Service, Healthcare, Tech Support"}, {"name": "Active Listener", "def": "I hear what people mean, not just what they say", "careers": "Therapy, Management, Medicine, Social Work"}, {"name": "Multilingual", "def": "I speak more than one language", "careers": "International Business, Translation, Education, Diplomacy"}, {"name": "Humorous", "def": "I use humor to connect with people and lighten tension", "careers": "Entertainment, Marketing, Teaching, Sales"}, {"name": "Diplomatic", "def": "I deliver hard truths kindly and respectfully", "careers": "Human Resources, Counseling, Management, Politics"}]}, {"name": "Leadership Strengths", "color": "#ec4899", "desc": "How you lead and influence", "strengths": [{"name": "Decision Maker", "def": "I make decisions calmly even under pressure", "careers": "Management, Emergency Services, Military, Surgery"}, {"name": "Problem Solver", "def": "I stay calm and think through solutions", "careers": "Engineering, Law, Medicine, Tech, Business"}, {"name": "Visionary", "def": "I imagine a better future and work toward it", "careers": "Entrepreneurship, Politics, Non-Profit, Architecture"}, {"name": "Accountable", "def": "I take ownership of my actions — good and bad", "careers": "Leadership roles in every field"}, {"name": "Fair-Minded", "def": "I treat everyone equally and make unbiased decisions", "careers": "Law, Human Resources, Education, Government"}, {"name": "Courageous", "def": "I do the right thing even when it's hard or scary", "careers": "Law Enforcement, Military, Activism, Medicine"}, {"name": "Mentor", "def": "I enjoy helping others grow and improve", "careers": "Teaching, Coaching, Management, Social Work"}, {"name": "Calm Under Pressure", "def": "I stay level-headed when everyone else is stressed", "careers": "Surgery, Air Traffic Control, Emergency Response, Management"}]}, {"name": "Technical & Creative", "color": "#22c55e", "desc": "What you can build, make, or do", "strengths": [{"name": "Tech Savvy", "def": "I learn new technology quickly and enjoy using it", "careers": "IT, Data Science, Engineering, Game Design"}, {"name": "Artistic", "def": "I can create beautiful or meaningful visual work", "careers": "Graphic Design, Architecture, Film, Fashion"}, {"name": "Musical", "def": "I have skill with music — performing, composing, or producing", "careers": "Music Production, Teaching, Film Scoring, Entertainment"}, {"name": "Athletic", "def": "I'm good at physical activities and sports", "careers": "Athletic Training, Physical Therapy, Coaching, Military"}, {"name": "Mechanical", "def": "I understand how machines and systems work", "careers": "Engineering, Automotive, Aviation, Manufacturing"}, {"name": "Scientific", "def": "I love experimenting and understanding how things work", "careers": "Research, Medicine, Environmental Science, Engineering"}, {"name": "Mathematical", "def": "I'm comfortable with numbers, patterns, and data", "careers": "Finance, Engineering, Science, Data Analysis"}, {"name": "Handy / Skilled Tradesperson", "def": "I'm good at building, fixing, and working with my hands", "careers": "Construction, Electrical, Plumbing, Carpentry"}]}]}, "MockInterview": {"categories": [{"name": "About You", "color": "#ec4899"}, {"name": "Strengths & Skills", "color": "#8b5cf6"}, {"name": "Problem-Solving", "color": "#f97316"}, {"name": "Teamwork", "color": "#0ec9b5"}, {"name": "Goals & Future", "color": "#f5c842"}, {"name": "Curveball", "color": "#22c55e"}], "questions": [{"cat": "About You", "text": "Tell me about yourself.", "tip": "Start with your name, something you're good at, and why you're excited about this opportunity. Keep it under 90 seconds."}, {"cat": "About You", "text": "What are three words that describe you?", "tip": "Pick words that are genuine AND relevant to the job. Be ready to give a quick example for each."}, {"cat": "About You", "text": "What is something you are really proud of?", "tip": "It doesn't have to be work-related — a personal achievement counts. Show why it matters to you."}, {"cat": "About You", "text": "What do you do in your free time?", "tip": "This shows your personality. It's okay to mention hobbies, sports, or creative interests."}, {"cat": "About You", "text": "What makes you different from other people applying for this job?", "tip": "This is your moment to stand out. Focus on a unique strength or experience."}, {"cat": "About You", "text": "How would your best friend describe you?", "tip": "Think about what your real friends would say — then connect it to why that makes you a good hire."}, {"cat": "About You", "text": "What is your biggest pet peeve?", "tip": "Be honest but keep it professional. Avoid anything that makes you sound difficult to work with."}, {"cat": "About You", "text": "What is the most important thing you've learned outside of school?", "tip": "Think about life lessons — hard work, kindness, persistence, family values. This is a great chance to show character."}, {"cat": "Strengths & Skills", "text": "What is your greatest strength?", "tip": "Pick ONE specific strength and back it up with a real example. 'I'm a hard worker' means nothing without proof."}, {"cat": "Strengths & Skills", "text": "What is your greatest weakness?", "tip": "Be honest — but show you're working on it. Never say 'I have no weaknesses.'"}, {"cat": "Strengths & Skills", "text": "What is a skill you want to improve?", "tip": "This is a growth question. Pick something real, and explain HOW you plan to get better at it."}, {"cat": "Strengths & Skills", "text": "Describe a time you had to learn something quickly.", "tip": "Walk through what it was, how you learned it, and what happened. Interviewers love specific stories."}, {"cat": "Strengths & Skills", "text": "What are you better at than most people your age?", "tip": "This is your chance to own something. Don't be modest — just be honest."}, {"cat": "Strengths & Skills", "text": "Tell me about a time you received feedback and what you did with it.", "tip": "Show that you can take criticism and improve. That's a sign of maturity."}, {"cat": "Problem-Solving", "text": "Tell me about a time you solved a difficult problem.", "tip": "Use the STAR method: Situation, Task, Action, Result. Keep it specific."}, {"cat": "Problem-Solving", "text": "What would you do if you didn't know how to complete an assigned task?", "tip": "Show that you ask for help, look for resources, and don't give up. That's a winning answer."}, {"cat": "Problem-Solving", "text": "Describe a time things didn't go as planned. How did you handle it?", "tip": "Employers love people who adapt. Show that you stay calm and find solutions."}, {"cat": "Problem-Solving", "text": "If you could change one thing about your school or neighborhood, what would it be and how?", "tip": "This tests your critical thinking and whether you care about more than just yourself."}, {"cat": "Problem-Solving", "text": "You're asked to complete a project but you don't have enough supplies. What do you do?", "tip": "Creative resourcefulness is a huge skill. Think: what CAN you do with what you have?"}, {"cat": "Teamwork", "text": "Tell me about a time you worked well in a team.", "tip": "Explain your specific role, what the team did, and what made it work. Interviewers want details."}, {"cat": "Teamwork", "text": "Tell me about a time you had a conflict with someone. How did you resolve it?", "tip": "Be honest but professional. Show you took responsibility for your part and worked toward a solution."}, {"cat": "Teamwork", "text": "Do you prefer working alone or in a group? Why?", "tip": "There's no perfect answer — just be honest. Most employers want people who can do both."}, {"cat": "Teamwork", "text": "Describe a time you had to help someone who was struggling.", "tip": "This shows empathy and leadership. Pick a real example — even from school or BGC."}, {"cat": "Teamwork", "text": "What would you do if a teammate wasn't doing their fair share?", "tip": "Show that you handle this professionally — talk to them directly, stay calm, involve a supervisor only if needed."}, {"cat": "Goals & Future", "text": "Where do you see yourself in 5 years?", "tip": "Be real, not ridiculous. Show ambition AND awareness that you're still figuring things out. That's actually impressive."}, {"cat": "Goals & Future", "text": "Why do you want this job?", "tip": "Connect your answer to what YOU can offer, not just what you want to get. Show you've done your homework."}, {"cat": "Goals & Future", "text": "What does success mean to you?", "tip": "There's no wrong answer — but think about it. Interviewers want to understand what drives you."}, {"cat": "Goals & Future", "text": "What kind of career do you think you might want someday?", "tip": "It's okay to be unsure. Show that you're exploring and thinking seriously about your future."}, {"cat": "Goals & Future", "text": "What are you doing right now to work toward your goals?", "tip": "Any answer is good as long as it's real — classes, clubs, jobs, practicing a skill. Show effort."}, {"cat": "Goals & Future", "text": "What would your dream job look like?", "tip": "Dream big but stay grounded. Describe the environment, the impact, and what you'd actually be doing day-to-day."}, {"cat": "Curveball", "text": "If you were a superhero, what would your power be and why?", "tip": "This is a personality and creativity question. Pick something that also reflects a real strength — and have fun with it."}, {"cat": "Curveball", "text": "If you could have dinner with any person in history, who would it be?", "tip": "Your choice reveals your values and interests. Be ready to explain why that person matters to you."}, {"cat": "Curveball", "text": "Sell me this pen.", "tip": "This is a classic sales interview test. Don't describe the pen — find out what I NEED and explain how the pen helps me."}, {"cat": "Curveball", "text": "What would you do with $1 million?", "tip": "Your answer reveals your values, creativity, and priorities. There's no wrong answer — just make it thoughtful."}, {"cat": "Curveball", "text": "If you could create any law, what would it be?", "tip": "Think about a problem that matters to you. This shows you care about more than just yourself."}, {"cat": "Curveball", "text": "What's something you believe that most people disagree with?", "tip": "Be genuine. This tests your confidence and ability to defend your thinking respectfully."}]}, "Pathway": {"adventures": [{"id": "helping", "name": "Helping People", "icon": "🤝", "desc": "You care about making a difference in people's lives.", "color": "#0ec9b5", "tree": {"id": "start", "icon": "🤝", "title": "You Love Helping People", "desc": "You get energy from making a difference in someone's day — comforting a friend, helping a stranger, solving someone's problem.", "question": "What KIND of helping feels most natural to you?", "choices": [{"text": "Helping people heal or feel better physically", "sub": "Medicine, therapy, health-related work", "next": {"id": "health", "icon": "🏥", "title": "You're drawn to Health & Healing", "desc": "You want to help people feel better — whether that's physically, emotionally, or both.", "question": "Which part of the health world calls to you?", "choices": [{"text": "Direct patient care — being there when people are sick or hurt", "sub": "Hands-on, fast-paced, emotionally demanding", "next": {"id": "direct-care", "icon": "👩‍⚕️", "title": "Direct Patient Care", "desc": "You want to be IN THE ROOM when people need help most.", "question": "What setting sounds right to you?", "choices": [{"text": "Hospitals and emergencies — high stakes, high pressure", "sub": "Doctor, Nurse, Paramedic", "dest": "doctor"}, {"text": "One-on-one ongoing care — building relationships over time", "sub": "Physical Therapist, Counselor, Family Doctor", "dest": "therapist"}]}}, {"text": "Behind the scenes — research, technology, or mental health", "sub": "Quieter environments, technical or emotional focus", "dest": "researcher"}]}}, {"text": "Teaching, coaching, or mentoring others to grow", "sub": "Schools, sports, community programs", "next": {"id": "teaching", "icon": "📚", "title": "You Love Helping People Grow", "desc": "Watching someone finally \"get it\" because of YOUR help? That's your superpower.", "question": "Who do you most want to help grow?", "choices": [{"text": "Kids and young people — shaping the next generation", "sub": "Teacher, Counselor, Youth Worker", "dest": "teacher"}, {"text": "Athletes — pushing people to their physical best", "sub": "Coach, Athletic Trainer, PE Teacher", "dest": "coach"}]}}, {"text": "Social work, advocacy, or community programs", "sub": "Fighting for fairness, supporting families", "dest": "socialworker"}]}}, {"id": "building", "name": "Building Things", "icon": "🔨", "desc": "You love creating, making, and solving technical problems.", "color": "#f97316", "tree": {"id": "start", "icon": "🔨", "title": "You Love Building Things", "desc": "Whether it's coding, construction, or circuits — you get excited when you can see the thing you made.", "question": "What kind of building gets you excited?", "choices": [{"text": "Digital things — software, apps, websites, games", "sub": "Tech, computers, code", "next": {"id": "digital", "icon": "💻", "title": "You're a Digital Builder", "desc": "You want to create things in the digital world — and right now, the digital world is EVERYTHING.", "question": "What part of tech excites you most?", "choices": [{"text": "Making apps or games people actually use", "sub": "Software Developer, Game Designer, UX Designer", "dest": "developer"}, {"text": "Protecting systems from hackers and threats", "sub": "Cybersecurity Analyst, Network Engineer", "dest": "cybersecurity"}]}}, {"text": "Physical things — buildings, machines, infrastructure", "sub": "Engineering, construction, manufacturing", "next": {"id": "physical", "icon": "🏗️", "title": "You're a Physical Builder", "desc": "You want to build things people can touch, stand in, or drive on.", "question": "What kind of physical creation draws you?", "choices": [{"text": "Designing spaces — architecture, interior design, urban planning", "sub": "Architect, Civil Engineer, Urban Planner", "dest": "architect"}, {"text": "Making machines work — mechanical, electrical, industrial", "sub": "Mechanical Engineer, Electrician, Industrial Designer", "dest": "engineer"}]}}, {"text": "Food — cooking, creating dishes, running a kitchen", "sub": "Culinary arts, restaurant management", "dest": "chef"}]}}, {"id": "creative", "name": "Creative Expression", "icon": "🎨", "desc": "You see the world differently and want to share that.", "color": "#ec4899", "tree": {"id": "start", "icon": "🎨", "title": "You're a Creative", "desc": "You notice things others don't. You feel things deeply. And you have a burning need to express it.", "question": "How do you most naturally express yourself?", "choices": [{"text": "Visual art, design, photography, or film", "sub": "Things people see and look at", "next": {"id": "visual", "icon": "🖼️", "title": "You Think Visually", "desc": "You communicate through images, color, and design. The visual world is your language.", "question": "Where do you want your visual work to live?", "choices": [{"text": "Advertising, branding, and digital design", "sub": "Graphic Designer, Art Director, UX Designer", "dest": "graphicdesigner"}, {"text": "Film, photography, or visual storytelling", "sub": "Filmmaker, Photographer, Animator", "dest": "filmmaker"}]}}, {"text": "Writing, journalism, or storytelling", "sub": "Words, stories, ideas", "next": {"id": "writing", "icon": "✍️", "title": "You're a Storyteller", "desc": "You believe words can change minds, move hearts, and shape culture.", "question": "What kind of writing calls to you?", "choices": [{"text": "Journalism, news, and telling real stories that matter", "sub": "Journalist, Reporter, Podcast Host", "dest": "journalist"}, {"text": "Creative writing — fiction, screenwriting, content creation", "sub": "Author, Screenwriter, Content Creator", "dest": "author"}]}}, {"text": "Music, performance, or entertainment", "sub": "Stage, sound, screen", "dest": "performer"}]}}, {"id": "leading", "name": "Leading & Organizing", "icon": "🏆", "desc": "You like being in charge, making decisions, and running things.", "color": "#f5c842", "tree": {"id": "start", "icon": "🏆", "title": "You're a Natural Leader", "desc": "You don't just want to be part of the team — you want to be the one making the calls and moving things forward.", "question": "What do you want to lead?", "choices": [{"text": "A business — my own company or a team in a company", "sub": "Entrepreneurship, management, corporate leadership", "next": {"id": "business", "icon": "💼", "title": "You Want to Run Things", "desc": "Whether it's your own startup or a Fortune 500 team — you see leadership as your calling.", "question": "What kind of business leader fits you?", "choices": [{"text": "Entrepreneur — I want to build something of my own from scratch", "sub": "Startup Founder, Small Business Owner, Inventor", "dest": "entrepreneur"}, {"text": "Corporate leader — I want to run teams inside a big organization", "sub": "Manager, Executive, Operations Director", "dest": "manager"}]}}, {"text": "A community, city, or country — public service and government", "sub": "Politics, law, public administration", "dest": "politician"}, {"text": "People through sport — coaching, athletics, sports management", "sub": "Sports leadership, training, team management", "dest": "sportsmanager"}]}}, {"id": "investigating", "name": "Investigating & Discovering", "icon": "🔬", "desc": "You ask questions, dig for answers, and love figuring things out.", "color": "#8b5cf6", "tree": {"id": "start", "icon": "🔬", "title": "You're a Natural Investigator", "desc": "Why? How? What if? You can't turn off the curiosity — and that's actually a superpower.", "question": "What kind of mysteries do you want to solve?", "choices": [{"text": "Scientific mysteries — how nature, medicine, or technology works", "sub": "Research, labs, experiments", "next": {"id": "science", "icon": "🧪", "title": "You Love Scientific Discovery", "desc": "You want to understand how the world actually works — at the molecular, environmental, or technological level.", "question": "What branch of science excites you?", "choices": [{"text": "Biology, medicine, or the human body", "sub": "Biologist, Medical Researcher, Genetic Counselor", "dest": "researcher"}, {"text": "Environment, climate, or earth science", "sub": "Environmental Scientist, Geologist, Climate Researcher", "dest": "environmentalscientist"}]}}, {"text": "Human mysteries — why people do what they do", "sub": "Psychology, sociology, criminal justice", "next": {"id": "human", "icon": "🧠", "title": "You're Fascinated by People", "desc": "You want to understand human behavior — what drives people, what breaks them, and what heals them.", "question": "Where do you want to focus that curiosity?", "choices": [{"text": "Psychology and mental health — the science of the mind", "sub": "Psychologist, Therapist, Behavioral Analyst", "dest": "psychologist"}, {"text": "Crime, justice, and figuring out what really happened", "sub": "Detective, Forensic Scientist, Criminologist", "dest": "detective"}]}}, {"text": "Financial mysteries — patterns in data, markets, and money", "sub": "Economics, finance, data science", "dest": "datascientist"}]}}], "destinations": {"doctor": {"icon": "👨‍⚕️", "title": "Doctor or Nurse", "cluster": "Health Science", "salary": "$75,000 – $300,000+", "education": "4 yrs college + medical school (Doctor) or 2–4 yrs nursing program", "jobs": ["Emergency Physician", "Pediatric Nurse", "Surgeon", "Family Doctor", "Obstetrician"], "path": ["Take science and biology classes seriously in high school", "Volunteer at a hospital or clinic", "Complete a 4-year biology/pre-med degree", "Apply to medical school or nursing program", "Residency or clinical hours"], "lesson": "Whether you become a doctor or nurse, both paths start the same way — caring about people and working hard in science. The level of education is different, but the heart behind it is identical."}, "therapist": {"icon": "💙", "title": "Therapist or Counselor", "cluster": "Health Science / Human Services", "salary": "$50,000 – $100,000+", "education": "4-year degree + master's degree + licensure", "jobs": ["Physical Therapist", "Mental Health Counselor", "Occupational Therapist", "School Psychologist", "Marriage Therapist"], "path": ["Study psychology, social work, or kinesiology", "Complete supervised internship hours", "Earn a master's degree in your specialty", "Pass state licensing exam", "Build a caseload or join a practice"], "lesson": "Therapists and counselors can specialize in physical OR emotional healing — two very different fields that both require patience, empathy, and years of training. Same starting point, very different destinations."}, "researcher": {"icon": "🔬", "title": "Medical or Scientific Researcher", "cluster": "Science Technology Engineering & Mathematics", "salary": "$55,000 – $120,000+", "education": "4-year science degree + master's or PhD", "jobs": ["Clinical Researcher", "Biomedical Scientist", "Pharmaceutical Developer", "Lab Technician", "Genetic Counselor"], "path": ["Excel in science and math courses", "Seek research opportunities in high school or college", "Earn a science-focused bachelor's degree", "Continue to master's or PhD for research roles", "Publish research or join a lab team"], "lesson": "Research doesn't always feel like \"helping\" — but the vaccine that saved millions? A researcher made that. The work is invisible until it changes everything."}, "teacher": {"icon": "📚", "title": "Teacher or School Counselor", "cluster": "Education & Training", "salary": "$40,000 – $80,000+", "education": "4-year education degree + state teaching license", "jobs": ["Elementary Teacher", "Middle School Teacher", "School Counselor", "Special Education Teacher", "Curriculum Designer"], "path": ["Volunteer or intern with youth programs (like BGC!)", "Study education, psychology, or your subject area", "Complete student-teaching practicum", "Pass state certification exams", "Apply for teaching positions or counseling roles"], "lesson": "Teachers who had the biggest impact on you probably didn't realize it at the time. The most powerful career in the room is often the quietest one."}, "coach": {"icon": "🏆", "title": "Coach or Athletic Trainer", "cluster": "Education & Training / Health Science", "salary": "$35,000 – $100,000+", "education": "2–4 year degree in kinesiology, sports science, or education", "jobs": ["High School Coach", "Athletic Trainer", "Sports Performance Coach", "Physical Education Teacher", "Personal Trainer"], "path": ["Participate in sports and observe what great coaching looks like", "Study kinesiology, sports science, or PE", "Complete certifications (CPR, First Aid, strength & conditioning)", "Assist a coach or trainer as an intern", "Build your coaching philosophy and take your first position"], "lesson": "The best coaches weren't always the best athletes. Understanding HOW people learn and improve is a completely different skill than being the best player."}, "socialworker": {"icon": "🤝", "title": "Social Worker or Community Advocate", "cluster": "Human Services", "salary": "$38,000 – $75,000+", "education": "4-year social work degree + master's for clinical roles", "jobs": ["Child Protective Services Worker", "School Social Worker", "Community Outreach Coordinator", "Case Manager", "Youth Program Director"], "path": ["Volunteer with community organizations and nonprofits", "Study social work, psychology, or sociology", "Complete field placement hours in a social services setting", "Earn your bachelor's and consider a master's for advanced roles", "Specialize in a population — children, elderly, substance abuse, etc."], "lesson": "Social workers carry some of the heaviest emotional loads of any profession. The job is hard precisely because it matters so much. People who choose this path don't just want a career — they want to fight for something."}, "developer": {"icon": "💻", "title": "Software Developer or Game Designer", "cluster": "Information Technology", "salary": "$70,000 – $180,000+", "education": "2–4 year degree in computer science OR self-taught bootcamp", "jobs": ["Software Engineer", "Front-End Web Developer", "Game Designer", "Mobile App Developer", "UX Engineer"], "path": ["Start coding NOW — free platforms like Scratch, Khan Academy, or freeCodeCamp", "Build personal projects and put them on GitHub", "Study computer science or attend a coding bootcamp", "Build a portfolio of real projects", "Apply for internships and entry-level developer roles"], "lesson": "Tech is one of the few careers where a 17-year-old can teach themselves to do something that pays six figures. The degree helps — but the portfolio matters more."}, "cybersecurity": {"icon": "🔐", "title": "Cybersecurity Analyst", "cluster": "Information Technology", "salary": "$75,000 – $160,000+", "education": "4-year degree in cybersecurity or computer science + certifications", "jobs": ["Cybersecurity Analyst", "Ethical Hacker (Penetration Tester)", "Security Engineer", "Network Security Specialist", "Incident Response Analyst"], "path": ["Learn networking basics and programming fundamentals", "Pursue certifications like CompTIA Security+ or CEH", "Study cybersecurity or computer science in college", "Practice on platforms like TryHackMe or Hack The Box", "Land an entry-level security analyst role"], "lesson": "Cybersecurity professionals are paid to think like criminals — ethically. Every company, hospital, and government needs people who can defend their systems. Demand is exploding and supply is low."}, "architect": {"icon": "🏛️", "title": "Architect or Urban Planner", "cluster": "Architecture & Construction", "salary": "$60,000 – $130,000+", "education": "5-year architecture degree + licensure (3 exams)", "jobs": ["Architect", "Interior Designer", "Urban Planner", "Landscape Architect", "Construction Manager"], "path": ["Take drafting, art, and math classes seriously", "Build a portfolio of design projects — even hand-drawn ones", "Complete a 5-year architecture program (B.Arch)", "Intern at an architecture firm", "Pass licensure exams (ARE) to become a licensed architect"], "lesson": "Architects shape how people FEEL about the spaces they live in. A school that feels safe, a hospital that doesn't feel scary, a neighborhood with parks — those don't happen by accident."}, "engineer": {"icon": "⚙️", "title": "Engineer (Mechanical, Electrical, Civil)", "cluster": "Architecture & Construction / Manufacturing", "salary": "$65,000 – $150,000+", "education": "4-year engineering degree", "jobs": ["Mechanical Engineer", "Electrical Engineer", "Civil Engineer", "Industrial Designer", "Aerospace Engineer"], "path": ["Excel in math and physics", "Join robotics, engineering clubs, or maker spaces", "Earn a 4-year engineering degree (ABET-accredited program)", "Complete internships in your engineering specialty", "Pursue Professional Engineer (PE) licensure"], "lesson": "Every bridge, plane, phone, and hospital machine was engineered by someone. Engineers make the world safer, faster, and more efficient — and they rarely get enough credit for it."}, "chef": {"icon": "👨‍🍳", "title": "Chef or Restaurant Owner", "cluster": "Hospitality & Tourism", "salary": "$35,000 – $120,000+", "education": "2–4 year culinary program OR apprenticeship", "jobs": ["Executive Chef", "Sous Chef", "Restaurant Owner", "Food Stylist", "Catering Manager"], "path": ["Cook constantly — experiment at home, learn techniques online", "Work in a restaurant as a host, dishwasher, or prep cook", "Complete a culinary arts program or professional apprenticeship", "Work your way up the kitchen ladder (prep → line → sous → executive)", "Open your own restaurant or catering business"], "lesson": "Restaurant ownership is one of the hardest businesses to run — but also one of the most personally rewarding. The failure rate is high, but chefs who master both the cooking AND the business side build lasting legacies."}, "graphicdesigner": {"icon": "🎨", "title": "Graphic Designer or Art Director", "cluster": "Arts Audio/Video Technology & Communications", "salary": "$45,000 – $110,000+", "education": "4-year design degree OR self-taught portfolio", "jobs": ["Graphic Designer", "Brand Identity Designer", "Art Director", "UX/UI Designer", "Motion Graphics Artist"], "path": ["Learn design tools — Canva, then Adobe Illustrator and Photoshop", "Build a portfolio of real work (school projects, logos, posters)", "Study graphic design, visual communication, or fine arts", "Freelance or intern at a design agency", "Build your specialty — branding, web, packaging, motion"], "lesson": "Great design is invisible — you only notice it when it's bad. Designers shape how every brand, app, and product looks and feels. If you've ever thought \"that logo is terrible\" — you're already thinking like a designer."}, "filmmaker": {"icon": "🎬", "title": "Filmmaker or Photographer", "cluster": "Arts Audio/Video Technology & Communications", "salary": "$35,000 – $150,000+", "education": "4-year film/arts degree OR self-taught", "jobs": ["Film Director", "Cinematographer", "Documentary Filmmaker", "Commercial Photographer", "Video Editor"], "path": ["Start making videos NOW — phone cameras are good enough", "Study film, photography, or visual arts", "Build a portfolio of short films, photos, or content", "Enter film festivals, photography competitions, YouTube", "Intern on professional film sets or at studios"], "lesson": "The most successful filmmakers didn't wait for permission — they started making things. Spielberg made his first film at age 12. What's stopping you?"}, "journalist": {"icon": "📰", "title": "Journalist or Podcast Host", "cluster": "Arts Audio/Video Technology & Communications", "salary": "$40,000 – $100,000+", "education": "4-year journalism or communications degree", "jobs": ["Investigative Reporter", "News Anchor", "Podcast Host", "Foreign Correspondent", "Magazine Writer"], "path": ["Write for your school newspaper or blog — start NOW", "Study journalism, communications, or English", "Intern at a local newspaper, radio station, or digital news outlet", "Build a portfolio of published work", "Pitch stories and build your byline"], "lesson": "Journalism is one of the few careers where the WORK is the application. You don't just say you're a writer — you write things. Your portfolio starts today."}, "author": {"icon": "✍️", "title": "Author or Content Creator", "cluster": "Arts Audio/Video Technology & Communications", "salary": "$25,000 – $200,000+ (wide range)", "education": "4-year English/creative writing degree OR self-published", "jobs": ["Novelist", "Screenwriter", "Content Creator", "Copywriter", "Technical Writer"], "path": ["Write every day — journaling, short stories, scripts, anything", "Study English, creative writing, or communications", "Build an audience through a blog, newsletter, or social media", "Submit work to publications, contests, and literary agents", "Self-publish or pursue traditional publishing"], "lesson": "Almost every successful author was told \"no\" dozens of times. J.K. Rowling was rejected by 12 publishers. The writers who succeed are the ones who kept writing anyway."}, "performer": {"icon": "🎭", "title": "Musician, Actor, or Performer", "cluster": "Arts Audio/Video Technology & Communications", "salary": "$25,000 – $1,000,000+ (huge range)", "education": "4-year arts conservatory OR BFA OR self-trained", "jobs": ["Actor", "Musician", "Music Producer", "Voice Actor", "Choreographer"], "path": ["Train your craft NOW — lessons, practice, performance", "Participate in theater, band, dance, or open mic events", "Consider a performing arts conservatory or BFA program", "Build an online presence and audition, audition, audition", "Develop a backup income stream while you build your career"], "lesson": "The performing arts have the widest income gap of any field — huge stars and struggling artists. Success requires extraordinary talent AND extraordinary work ethic AND some luck. But the people who make it would choose no other path."}, "entrepreneur": {"icon": "🚀", "title": "Entrepreneur / Business Founder", "cluster": "Business Management & Administration", "salary": "$0 – unlimited (depends on the business)", "education": "Business degree helpful, but many succeed without one", "jobs": ["Startup Founder", "Small Business Owner", "Social Entrepreneur", "Franchise Owner", "Venture Capitalist"], "path": ["Study how businesses work — read, watch, and learn from entrepreneurs", "Find a problem and brainstorm how to solve it profitably", "Take business, economics, and marketing classes", "Build a small \"practice business\" — a side hustle, a lemonade stand, a service", "Study business or launch directly and learn by doing"], "lesson": "Entrepreneurs don't have guaranteed salaries or job security — they trade those for freedom and upside. The most successful ones didn't just have a great idea — they had the grit to keep going when it got hard."}, "manager": {"icon": "💼", "title": "Business Manager or Executive", "cluster": "Business Management & Administration", "salary": "$55,000 – $250,000+", "education": "4-year business degree + MBA for senior roles", "jobs": ["Operations Manager", "Marketing Director", "Human Resources Manager", "CEO", "Supply Chain Director"], "path": ["Build leadership experience — clubs, sports, student government", "Study business, management, marketing, or finance", "Internships at companies in your area of interest", "Start in an entry-level role and build experience", "Pursue an MBA to accelerate into senior leadership"], "lesson": "Great managers are rare — most people are promoted because they were good at a job, not because they're good at leading others. The best managers spend more time developing their people than doing the work themselves."}, "politician": {"icon": "🏛️", "title": "Politician, Lawyer, or Public Servant", "cluster": "Government & Public Administration / Law", "salary": "$50,000 – $200,000+", "education": "4-year poli-sci/history/pre-law degree + law school (for lawyers)", "jobs": ["City Councilmember", "State Representative", "Lawyer", "Judge", "Policy Analyst", "Diplomat"], "path": ["Get involved in community issues and civic organizations NOW", "Study political science, public policy, or pre-law", "Intern for a local government office or nonprofit", "Attend law school OR run for local office OR join public administration", "Build a record of public service"], "lesson": "Most politicians started by caring about ONE local issue — a neighborhood park, a school program, a community need. You don't have to start at the top. Start where you are."}, "sportsmanager": {"icon": "🏅", "title": "Coach or Sports Manager", "cluster": "Education & Training / Business", "salary": "$40,000 – $200,000+", "education": "4-year sports management, kinesiology, or business degree", "jobs": ["Head Coach", "General Manager", "Athletic Director", "Sports Agent", "Stadium Operations Manager"], "path": ["Play sports AND study the business side — rosters, contracts, strategy", "Study sports management, business, or kinesiology", "Intern with a team, league, or athletic department", "Build connections in the sports industry", "Start in operations, scouting, or assistant coaching and work up"], "lesson": "Almost no one becomes a head coach or GM directly. The path runs through years of assistant roles, networking, and building a reputation. Every professional sports leader started somewhere much smaller."}, "environmentalscientist": {"icon": "🌍", "title": "Environmental Scientist or Climate Researcher", "cluster": "Agriculture Food & Natural Resources / STEM", "salary": "$50,000 – $110,000+", "education": "4-year environmental science degree + possible master's", "jobs": ["Environmental Scientist", "Climate Researcher", "Conservation Biologist", "Environmental Engineer", "Park Ranger"], "path": ["Get outside — nature isn't just something to study in a classroom", "Study biology, chemistry, and earth science", "Earn a degree in environmental science, ecology, or earth systems", "Intern with environmental agencies, national parks, or research labs", "Specialize in climate, water, soil, wildlife, or policy"], "lesson": "Environmental scientists are working on some of the most important problems humans have ever faced. Climate change, water scarcity, extinction — these aren't future problems. They need people working on them right now."}, "psychologist": {"icon": "🧠", "title": "Psychologist or Behavioral Analyst", "cluster": "Health Science / Human Services", "salary": "$55,000 – $130,000+", "education": "4-year psychology degree + doctoral degree (PhD or PsyD)", "jobs": ["Clinical Psychologist", "School Psychologist", "Behavioral Analyst", "Industrial-Organizational Psychologist", "Research Psychologist"], "path": ["Study AP Psychology and human behavior wherever you can", "Earn a 4-year psychology degree", "Complete a doctoral program (5–7 years including internship)", "Complete supervised hours and pass licensure exams", "Specialize in clinical, school, research, or organizational psychology"], "lesson": "Psychologists spend years studying the mind before they're ever licensed to treat someone. The long road isn't a barrier — it's preparation for one of the most complex and rewarding jobs on earth."}, "detective": {"icon": "🔍", "title": "Detective or Forensic Scientist", "cluster": "Law Public Safety Corrections & Security", "salary": "$50,000 – $120,000+", "education": "4-year criminal justice or forensic science degree", "jobs": ["Police Detective", "FBI Agent", "Forensic Scientist", "Crime Scene Investigator", "Criminologist"], "path": ["Study criminal justice, forensic science, or psychology", "Maintain a clean record — law enforcement does thorough background checks", "Complete a law enforcement academy or federal agency application process", "Work as a patrol officer before advancing to detective (most agencies require this)", "Specialize in forensics, homicide, cybercrime, or federal investigation"], "lesson": "TV makes detective work look fast and glamorous. Real investigations are slow, methodical, and require extraordinary attention to detail. The people who thrive in this field love puzzles — and have the patience to solve them."}, "datascientist": {"icon": "📊", "title": "Data Scientist or Financial Analyst", "cluster": "Finance / Information Technology", "salary": "$70,000 – $180,000+", "education": "4-year math, statistics, computer science, or economics degree", "jobs": ["Data Scientist", "Financial Analyst", "Actuary", "Quantitative Analyst", "Business Intelligence Analyst"], "path": ["Build strong math and statistics foundations", "Learn Python, R, or SQL — free resources online", "Study math, statistics, economics, or computer science", "Work on real data projects and enter data competitions (Kaggle)", "Land an analyst or data science internship"], "lesson": "We live in a world drowning in data. People who can turn that data into decisions are among the most sought-after professionals on earth — and most companies have no idea how to use what they already have."}}}, "ColorQuiz": {"colorTypes": {"Gold": {"label": "🟡 Gold", "name": "Gold", "bg": "linear-gradient(135deg,#3d2f00,#5a4500)", "accent": "#f5c842", "tagline": "The Responsible Organizer — you keep everything running.", "traits": ["Organized", "Responsible", "Dependable", "Detail-oriented", "Traditional", "Loyal", "Hardworking", "Punctual"], "desc": "Gold personalities are the backbone of any group. You follow through on what you say, keep things in order, and take pride in doing things the right way. You might be the one people turn to when they need something done.", "careers": [{"emoji": "📋", "name": "Operations Manager", "why": "Gold types thrive managing systems, teams, and timelines."}, {"emoji": "⚖️", "name": "Lawyer or Judge", "why": "Fairness, rules, and responsibility are in your DNA."}, {"emoji": "🏥", "name": "Nurse or Medical Professional", "why": "Gold personalities are trusted with high-stakes responsibilities."}, {"emoji": "🏛️", "name": "Government Administrator", "why": "Public service appeals to your sense of duty and structure."}, {"emoji": "🧾", "name": "Accountant or Financial Planner", "why": "Detail-orientation + trustworthiness = financial career gold."}]}, "Blue": {"label": "🔵 Blue", "name": "Blue", "bg": "linear-gradient(135deg,#001a3d,#002a5c)", "accent": "#38bdf8", "tagline": "The Compassionate Connector — you care deeply about people.", "traits": ["Empathetic", "Creative", "Idealistic", "Communicative", "Romantic", "Authentic", "Spiritual", "Harmonious"], "desc": "Blue personalities lead with their heart. You're the person who checks in on people, notices when someone's upset, and genuinely wants the world to be better. You bring warmth, creativity, and meaning to everything you do.", "careers": [{"emoji": "💙", "name": "Counselor or Therapist", "why": "Blues are natural listeners who help others feel understood."}, {"emoji": "📚", "name": "Teacher or School Counselor", "why": "Your empathy and communication skills shine in education."}, {"emoji": "🎨", "name": "Artist, Writer, or Designer", "why": "Blues express deep feelings through creative work."}, {"emoji": "🤝", "name": "Social Worker", "why": "Fighting for people and families aligns with your values."}, {"emoji": "🏨", "name": "Nonprofit / Humanitarian Work", "why": "Blues are driven by purpose, not just a paycheck."}]}, "Green": {"label": "🟢 Green", "name": "Green", "bg": "linear-gradient(135deg,#001a0d,#002b16)", "accent": "#22c55e", "tagline": "The Independent Thinker — you live for ideas and knowledge.", "traits": ["Analytical", "Intellectual", "Independent", "Strategic", "Calm", "Curious", "Competent", "Logical"], "desc": "Green personalities love to understand how things work — the deeper, the better. You're the one who asks 'but why?' and isn't satisfied with surface-level answers. You trust logic over emotion and bring big-picture thinking to every problem.", "careers": [{"emoji": "🔬", "name": "Scientist or Researcher", "why": "Greens are built for deep intellectual exploration."}, {"emoji": "💻", "name": "Software Developer / Engineer", "why": "Logical thinking + problem-solving = perfect tech fit."}, {"emoji": "📊", "name": "Data Scientist or Analyst", "why": "Greens love turning complex data into clear insights."}, {"emoji": "🏗️", "name": "Architect or Engineer", "why": "Strategic design appeals to Green's systems thinking."}, {"emoji": "🧠", "name": "Psychologist or Behavioral Scientist", "why": "Greens want to understand the 'why' behind human behavior."}]}, "Orange": {"label": "🟠 Orange", "name": "Orange", "bg": "linear-gradient(135deg,#3d1500,#5c2100)", "accent": "#f97316", "tagline": "The Bold Action-Taker — you live in the moment and make things happen.", "traits": ["Adventurous", "Spontaneous", "Energetic", "Competitive", "Hands-on", "Charming", "Flexible", "Risk-taker"], "desc": "Orange personalities are doers — not planners. You learn by trying, lead through action, and thrive when there's energy and movement. You might get restless in a desk job, but you shine anywhere things are unpredictable and fast-paced.", "careers": [{"emoji": "🚒", "name": "Firefighter or Paramedic", "why": "Orange thrives in high-stakes, action-oriented environments."}, {"emoji": "🎤", "name": "Performer or Entertainer", "why": "Charisma and risk-taking make Orange a natural on stage."}, {"emoji": "🚀", "name": "Entrepreneur", "why": "Orange's boldness and comfort with risk fuel business ventures."}, {"emoji": "⚽", "name": "Athlete or Coach", "why": "Competitive, energetic, and physically engaged."}, {"emoji": "👮", "name": "Law Enforcement / Military", "why": "Oranges are built for fast decisions and physical challenges."}]}}}, "WYR": {"questions": [{"a": "Work outdoors in nature", "b": "Work in a modern office building", "sa": "Parks, wildlife, farms, construction", "sb": "Tech companies, law firms, hospitals", "d": ["What does your ideal work environment look like?", "Does the setting of a job matter as much as the work itself?"]}, {"a": "Make a lot of money doing something you're just okay at", "b": "Make less money doing something you LOVE", "sa": "Six figures, comfortable lifestyle, but not your passion", "sb": "Enough to live, but excited to go to work every day", "d": ["Is passion or money more important in a career — or can you have both?", "What's the minimum salary YOU would need to feel okay?"]}, {"a": "Be your own boss", "b": "Have a great boss who supports you", "sa": "Entrepreneur, freelancer, business owner", "sb": "Work for a company with a mentor leader", "d": ["What are the risks of being your own boss that people don't talk about?", "What makes a great boss?"]}, {"a": "Job where you travel constantly", "b": "Job where you work from home", "sa": "Flight attendant, diplomat, consultant", "sb": "Remote worker, writer, developer", "d": ["How would your personal life be different with constant travel vs. working from home?", "Which would you choose at 25? At 40? Does it change?"]}, {"a": "Save lives every day", "b": "Create something millions of people enjoy", "sa": "Doctor, firefighter, social worker", "sb": "Game designer, musician, filmmaker", "d": ["Is saving individual lives more meaningful than creating joy for millions?", "Can creative work also save lives?"]}, {"a": "Work with your hands, building or fixing things", "b": "Work with your mind, solving abstract problems", "sa": "Electrician, surgeon, carpenter, mechanic", "sb": "Data scientist, philosopher, software engineer, lawyer", "d": ["Which careers blur the line between 'hands' and 'mind'?", "Why do we sometimes undervalue physical/trade skills?"]}, {"a": "Work with children or teenagers", "b": "Work with adults in professional settings", "sa": "Teacher, pediatrician, social worker, coach", "sb": "Corporate consultant, surgeon, lawyer, engineer", "d": ["What personality traits make someone great with kids vs. adults?", "How might your comfort zone right now affect your career choices?"]}, {"a": "Be famous in your field", "b": "Be unknown but deeply respected by those who matter", "sa": "Celebrity chef, famous athlete, TED Talk speaker", "sb": "Brilliant researcher, neighborhood doctor, master craftsperson", "d": ["Is recognition important for career satisfaction?", "Name someone who is unknown to the public but changes lives every day."]}, {"a": "Work in the arts — creative, expressive, unpredictable", "b": "Work in science or tech — logical, structured, precise", "sa": "Design, film, music, writing", "sb": "Engineering, coding, medicine, research", "d": ["Are creative people really less logical? Are scientists really less creative?", "Name a career that requires BOTH."]}, {"a": "Career that helps your local community directly", "b": "Career that affects millions of people you'll never meet", "sa": "Local teacher, city council member, community health worker", "sb": "Policy maker, tech developer, pharmaceutical researcher", "d": ["Which type of impact is more meaningful to you personally?", "Can a career do both? Give an example."]}, {"a": "Have complete job security — same job for 30 years", "b": "Jump between exciting jobs every few years", "sa": "Government worker, tenured professor, union employee", "sb": "Consultant, entrepreneur, creative professional", "d": ["What are you gaining and losing in each scenario?", "Which do you think is more realistic in today's world?"]}, {"a": "Career in sports or entertainment", "b": "Career in healthcare or education", "sa": "Athlete, coach, actor, music producer", "sb": "Nurse, teacher, social worker, physical therapist", "d": ["Why do sports and entertainment careers seem glamorous but are often unstable?", "Which career do you think has more impact on society?"]}, {"a": "Work for a huge company with unlimited resources", "b": "Work for a tiny nonprofit with a mission you love", "sa": "Google, hospital system, Fortune 500", "sb": "Local food bank, small arts organization, neighborhood clinic", "d": ["What does each path offer that the other doesn't?", "Can you care about money AND meaning?"]}, {"a": "Career that exists today", "b": "Career that doesn't exist yet — you'll invent it", "sa": "Nurse, accountant, engineer", "sb": "AI ethicist in 2030, space tourism guide, neural interface designer", "d": ["What current technologies might create jobs we can't imagine yet?", "How do you prepare for a career that hasn't been invented?"]}, {"a": "Job with flexible hours but lower pay", "b": "High-paying job with strict 9-to-5 schedule", "sa": "Freelancer, teacher (summers off), part-time worker", "sb": "Investment banker, surgeon, corporate executive", "d": ["How does work schedule affect your personal life and relationships?", "Which would you choose at different stages of your life?"]}, {"a": "Work primarily alone — deep focus, solitary", "b": "Work primarily with a team — collaborative, social", "sa": "Researcher, writer, programmer, artist", "sb": "Project manager, coach, teacher, event planner", "d": ["Are introverts less suited for teamwork jobs? Why or why not?", "How can an introvert succeed in a people-heavy career?"]}, {"a": "Career where you make something with your hands", "b": "Career where you manage or lead other people", "sa": "Chef, carpenter, surgeon, artist", "sb": "Manager, principal, military officer, director", "d": ["What skills are needed to go from 'maker' to 'manager'?", "Can you do both? Name someone who does."]}, {"a": "Start at the top with a degree", "b": "Start at the bottom and work your way up", "sa": "Medical school, law school, MBA program", "sb": "Entry-level worker, apprentice, trade school", "d": ["What are the tradeoffs of each path financially and time-wise?", "Which path earns more respect? Which earns more money?"]}, {"a": "Career that solves a problem you personally experienced", "b": "Career solving a problem you've only read about", "sa": "Social worker who grew up in foster care, peer counselor", "sb": "Environmental engineer, international aid worker, policy researcher", "d": ["Does lived experience make you better or worse at a job?", "Can someone be deeply effective in a field they haven't lived through?"]}, {"a": "Career that will definitely still exist in 50 years", "b": "Career on the cutting edge that might disappear", "sa": "Plumber, teacher, doctor", "sb": "Social media manager, AI trainer, cryptocurrency analyst", "d": ["What does job security mean in a world where careers are changing so fast?", "How do you future-proof yourself for a rapidly changing job market?"]}]}, "CostOfLiving": {"questions": [{"type": "salary-match", "badge": "💼 Starting Salary", "badgeColor": "#0ec9b5", "headline": "A first-year teacher in Wisconsin earns about...", "main": "What's the starting salary for a teacher right out of college?", "context": "Wisconsin has its own pay scale. Teachers start lower and grow with experience. This doesn't include benefits like health insurance and a pension.", "choices": ["$28,000", "$38,000", "$52,000", "$72,000"], "correct": 1, "explain": "Wisconsin starting teacher salaries are typically around $35,000–$42,000. It's not a lot, but experienced teachers with advanced degrees can earn $60,000+. Benefits and job security add significant value.", "realNums": [{"city": "Wisconsin (avg)", "s": "$38,000", "note": "Starting"}, {"city": "Texas (avg)", "s": "$40,000", "note": "Starting"}, {"city": "New York", "s": "$51,000", "note": "Starting"}, {"city": "California", "s": "$50,000", "note": "Starting"}]}, {"type": "affordability", "badge": "🏠 Rent Reality", "badgeColor": "#8b5cf6", "headline": "Can a nurse afford a 1-bedroom apartment in Chicago?", "main": "A new nurse earns $62,000/year in Chicago. A 1-bedroom apartment costs $1,800/month. Is this comfortable?", "context": "Financial experts say you should spend no more than 30% of your GROSS (pre-tax) income on rent. $62,000 ÷ 12 months = $5,167/month gross.", "choices": ["Yes, easily", "Barely — right at the limit", "No — it's too expensive", "Depends on roommates"], "correct": 2, "explain": "$1,800/month rent on $5,167 gross = 35% of income — over the recommended 30%. After taxes, the nurse takes home roughly $3,900/month, meaning rent is 46% of take-home pay. Tight, but possible with careful budgeting — no luxuries.", "realNums": [{"city": "1BR Chicago", "s": "$1,800/mo", "note": "Average rent"}, {"city": "Nurse salary", "s": "$62k/yr", "note": "New RN"}, {"city": "Take-home", "s": "~$3,900/mo", "note": "After taxes"}, {"city": "Rent %", "s": "46%", "note": "Of take-home"}]}, {"type": "comparison", "badge": "📍 Location Matters", "badgeColor": "#f97316", "headline": "Which city does $75,000 go the FURTHEST in?", "main": "You're offered a $75,000 software job. Pick the city where this salary gives you the best standard of living.", "context": "Cost of living varies WILDLY across the U.S. $75,000 in one city might feel like $40,000 in another.", "choices": ["San Francisco, CA", "New York City, NY", "Austin, TX", "Nekoosa, WI area"], "correct": 3, "explain": "In rural Wisconsin, $75,000 is an excellent income — well above average. In San Francisco, after rent ($3,000+ for 1BR), taxes, and expenses, you'd barely break even. Location changes everything. Same salary, completely different life.", "realNums": [{"city": "San Francisco", "s": "$75k = ~$35k", "note": "Purchasing power"}, {"city": "NYC", "s": "$75k = ~$45k", "note": "Purchasing power"}, {"city": "Austin TX", "s": "$75k = ~$65k", "note": "Purchasing power"}, {"city": "Rural WI", "s": "$75k = ~$90k+", "note": "Purchasing power"}]}, {"type": "hidden-cost", "badge": "🎓 Student Debt", "badgeColor": "#ec4899", "headline": "A doctor earns $200k — but has $300k in student loans.", "main": "After 10 years of school and $300,000 in student loans at 6% interest, how much is this doctor paying monthly just in loan payments?", "context": "Medical school alone costs $250,000–$350,000 on average. The doctor starts their career with massive debt. Monthly loan payment on $300k at 6% over 20 years = ?", "choices": ["$500/month", "$1,200/month", "$2,150/month", "$3,500/month"], "correct": 2, "explain": "$300,000 at 6% interest over 20 years = about $2,149/month — that's $25,788 PER YEAR just to repay school loans. A doctor earning $200,000 takes home roughly $130,000 after taxes, then loses another $26,000 to loans. Still comfortable — but not as rich as it sounds.", "realNums": [{"city": "Loan payment", "s": "$2,149/mo", "note": "$300k @ 6% / 20yr"}, {"city": "Doctor salary", "s": "$200,000", "note": "Primary care MD"}, {"city": "After taxes", "s": "~$130,000", "note": "Take-home"}, {"city": "After loans", "s": "~$104,000", "note": "Real spending money"}]}, {"type": "trade", "badge": "🔧 Trade Careers", "badgeColor": "#22c55e", "headline": "Plumbers earn more than many college graduates.", "main": "An experienced licensed plumber in Wisconsin earns approximately how much per year?", "context": "Plumbers complete a 4–5 year apprenticeship (earning while learning — no debt) instead of college. Then they earn a competitive salary without six-figure student loans.", "choices": ["$28,000", "$42,000", "$68,000", "$95,000"], "correct": 2, "explain": "Wisconsin plumbers with 5+ years experience typically earn $60,000–$80,000. A master plumber who owns their own business can earn $100,000+. And crucially — NO student debt. They often end up wealthier in their 30s than college graduates still paying off loans.", "realNums": [{"city": "Apprentice (yr1)", "s": "$18–22/hr", "note": "Earning while learning"}, {"city": "Journeyman", "s": "$28–35/hr", "note": "Licensed"}, {"city": "Master Plumber", "s": "$40–55/hr", "note": "Full license"}, {"city": "Business owner", "s": "$100k+", "note": "Self-employed"}]}, {"type": "salary-match", "badge": "🎤 Dream Jobs", "badgeColor": "#ec4899", "headline": "What does the AVERAGE (not the famous ones) actor earn?", "main": "Most working actors in the U.S. earn about how much per year?", "context": "We see millionaire celebrities, but that's the 0.1%. What about the 99.9% of actors who don't become famous? Many have side jobs to survive.", "choices": ["$18,000", "$52,000", "$120,000", "$250,000"], "correct": 0, "explain": "The median annual income for actors is around $17,000–$20,000. Most working actors take on side jobs (bartending, teaching, waiting tables) to pay bills. Only a tiny fraction earn enough from acting alone. This doesn't mean don't pursue it — but go in with eyes open.", "realNums": [{"city": "Median actor", "s": "$17,500/yr", "note": "SAG data"}, {"city": "Top 10%", "s": "$60,000+", "note": "Established actors"}, {"city": "Top 1%", "s": "$1M+", "note": "Famous actors"}, {"city": "Side income", "s": "Essential", "note": "Most working actors"}]}, {"type": "affordability", "badge": "🚗 Hidden Costs", "badgeColor": "#f5c842", "headline": "A car adds $500/month to your expenses. Does that matter?", "main": "A social worker earning $42,000/year adds a car payment + insurance = $500/month. How much of their take-home does this eat up?", "context": "$42,000/yr gross. After taxes, take-home is approximately $2,900/month. A car payment of $350 + insurance of $150 = $500/month.", "choices": ["About 10%", "About 17%", "About 25%", "About 35%"], "correct": 1, "explain": "$500 ÷ $2,900 = 17.2% of take-home pay on just transportation. Add rent (ideally 30%), food, utilities, and phone — and you can see why budgeting matters. Many financial advisors say total transportation should be under 15%. This social worker is slightly over.", "realNums": [{"city": "Gross salary", "s": "$42,000", "note": "Before taxes"}, {"city": "Take-home", "s": "~$2,900/mo", "note": "After taxes"}, {"city": "Car total", "s": "$500/mo", "note": "Payment + insurance"}, {"city": "% of income", "s": "17%", "note": "On transportation"}]}, {"type": "comparison", "badge": "⚖️ Worth It?", "badgeColor": "#8b5cf6", "headline": "Lawyer vs. Paralegal — the math might surprise you.", "main": "A lawyer earns $95,000 with $180,000 in law school debt. A paralegal earns $52,000 with no additional debt. Who's wealthier at age 35?", "context": "The lawyer started working at 26 (after 3 years law school). The paralegal started at 22. By 35, each has worked different numbers of years and carries different debt.", "choices": ["The lawyer — by a lot", "The lawyer — slightly", "They're about equal", "The paralegal — surprisingly"], "correct": 3, "explain": "The paralegal worked 4 MORE years (ages 22–26) earning $52k = $208,000 extra earnings. The lawyer spent those years accumulating $180,000 in debt + interest. At 35, the paralegal may actually have more net worth — despite the lower salary. Debt changes everything.", "realNums": [{"city": "Lawyer at 35", "s": "Net worth varies", "note": "High salary, high debt"}, {"city": "Paralegal at 35", "s": "Often ahead", "note": "4 extra earning years"}, {"city": "Law school debt", "s": "$180,000", "note": "Average"}, {"city": "Break-even age", "s": "~38–42", "note": "When lawyer wins"}]}, {"type": "hidden-cost", "badge": "🏡 Dream Life Cost", "badgeColor": "#0ec9b5", "headline": "What salary do you need to live the 'American Dream'?", "main": "A home ($250k), 2 cars, vacations, kids' activities, retirement savings. What annual income do you need to afford this lifestyle comfortably in Wisconsin?", "context": "Home mortgage on $250k house ≈ $1,400/mo. Two car payments ≈ $700/mo. Groceries, utilities, insurance, savings, activities — add it all up.", "choices": ["$45,000/year", "$65,000/year", "$90,000/year", "$130,000/year"], "correct": 2, "explain": "Financial planners suggest you need roughly $80,000–$100,000 household income to comfortably afford this lifestyle in Wisconsin — less than coastal cities but more than many people expect. Many dual-income families split this between two earners, each making $45–55k.", "realNums": [{"city": "Mortgage", "s": "$1,400/mo", "note": "$250k home"}, {"city": "Cars", "s": "$700/mo", "note": "Two vehicles"}, {"city": "All other expenses", "s": "~$2,400/mo", "note": "Food, utilities, etc."}, {"city": "Total needed", "s": "~$4,500/mo", "note": "= $90k/yr household"}]}, {"type": "trade", "badge": "💻 Tech Reality", "badgeColor": "#0ec9b5", "headline": "Entry-level coders in the Midwest earn how much?", "main": "A new software developer with a 2-year coding bootcamp (no 4-year degree) in Wisconsin earns approximately how much in their first job?", "context": "Coding bootcamps take 3–6 months and cost $10,000–$20,000. Entry-level developer jobs in the Midwest pay differently than coastal tech hubs.", "choices": ["$28,000", "$48,000", "$65,000", "$95,000"], "correct": 2, "explain": "Wisconsin entry-level developer salaries typically range from $55,000–$75,000 — with bootcamp grads landing closer to $55–65k to start. With 3–5 years experience, they often reach $80–100k. And with only $15k in bootcamp debt vs. $60k in CS degree debt, they may build wealth faster.", "realNums": [{"city": "WI entry-level", "s": "$55–65k", "note": "Bootcamp grad"}, {"city": "WI mid-level", "s": "$80–100k", "note": "3–5 yrs exp"}, {"city": "Chicago/remote", "s": "$75–95k", "note": "Entry-level"}, {"city": "SF/NYC", "s": " ,300 take-home. Then: rent ($800–1,200), car ($400), groceries ($300), utilities/phone ($200), savings ($300) = you have maybe $400–800/month for everything else. Budget planning matters!", "realNums": [{"city": "Gross monthly", "s": "$4,166", "note": "$50k ÷ 12"}, {"city": "After taxes", "s": "~$3,200", "note": "Take-home"}, {"city": "Fixed expenses", "s": "~$2,400", "note": "Rent, car, food"}, {"city": "Discretionary", "s": "~$800", "note": "Everything else"}]}, {"type": "comparison", "badge": "🚀 Big Picture", "badgeColor": "#f5c842", "headline": "Two paths to age 60 — who wins?", "main": "Person A: 4-year degree, starts at $55k at age 22, grows to $90k. Person B: Electrician apprenticeship, starts at $35k at 18, grows to $85k. By retirement, who has earned MORE total?", "context": "Person B starts earning 4 years earlier with no debt. Person A starts higher but later with potential debt. Both grow their salary over time.", "choices": ["Person A by a lot", "Person A slightly", "They're about equal", "Person B — because of the head start"], "correct": 3, "explain": "Person B works 4 extra years (ages 18–22) AND carries no student debt. Over a 42-year career vs 38-year career, and with no interest payments, Person B often accumulates equal or greater lifetime wealth. Higher salary doesn't always mean more money in the bank.", "realNums": [{"city": "Person A lifetime", "s": "~$2.8M earned", "note": "38 yr career"}, {"city": "Person B lifetime", "s": "~$2.7M earned", "note": "42 yr career"}, {"city": "Debt difference", "s": "$0–60k", "note": "No debt vs student loans"}, {"city": "Net result", "s": "Roughly equal", "note": "With investment gains"}]}]}, "MadLibs": {"stories": {"doctor": {"name": "🩺 Doctor / Physician", "blanks": [{"type": "Plural Noun", "hint": "A thing you can have more than one of (e.g. cats, pizzas, rocks)"}, {"type": "Adjective", "hint": "A word that describes something (e.g. slimy, enormous, sparkly)"}, {"type": "Verb ending in -ing", "hint": "An action word with -ing (e.g. running, sneezing, wobbling)"}, {"type": "Body Part", "hint": "Any part of the human body"}, {"type": "Adjective", "hint": "A word that describes something"}, {"type": "Plural Noun", "hint": "A thing you can have more than one of"}, {"type": "Verb (past tense)", "hint": "Something that already happened (e.g. jumped, exploded, whispered)"}, {"type": "Number", "hint": "Any number"}, {"type": "Silly Sound", "hint": "A made-up sound (e.g. BLORP, KAPOW, WHOOOOSH)"}, {"type": "Adjective", "hint": "A word that describes something"}, {"type": "Famous Person", "hint": "Anyone famous — real or fictional"}, {"type": "Verb", "hint": "An action word (e.g. sprint, calculate, wobble)"}], "debrief": [{"emoji": "🧠", "text": "<b>Real soft skill shown:</b> Doctors need <b>calm under pressure</b> — even when situations feel chaotic, they have to stay focused and make clear decisions."}, {"emoji": "💬", "text": "<b>Real communication skill:</b> Explaining a diagnosis to a patient in plain language — not just medical jargon — is one of the hardest and most important parts of being a doctor."}, {"emoji": "📊", "text": "<b>Real hard skill:</b> Doctors analyze test results, vital signs, and patient history to reach a diagnosis. It's part science, part pattern recognition."}, {"emoji": "💰", "text": "<b>Real salary:</b> Doctors earn $200,000–$400,000+ per year — but spend 8+ years in school and residency before their first real paycheck."}, {"emoji": "❓", "text": "<b>Discussion:</b> What surprised you about what a doctor's day actually looks like? What soft skills does this job require that school doesn't teach?"}]}, "chef": {"name": "👨‍🍳 Chef / Culinary Professional", "blanks": [{"type": "Food Item", "hint": "Any food — the weirder the better"}, {"type": "Adjective", "hint": "A word that describes something (e.g. rubbery, magnificent, chaotic)"}, {"type": "Verb ending in -ing", "hint": "An action word with -ing (e.g. flipping, screaming, gliding)"}, {"type": "Liquid", "hint": "Any liquid — water, lemonade, motor oil, anything"}, {"type": "Number", "hint": "Any number"}, {"type": "Animal", "hint": "Any animal"}, {"type": "Adjective", "hint": "A word that describes something"}, {"type": "Famous Person", "hint": "Anyone famous — real or fictional"}, {"type": "Silly Noise", "hint": "A made-up sound"}, {"type": "Emotion", "hint": "How someone feels (e.g. horrified, ecstatic, confused)"}, {"type": "Verb", "hint": "An action word"}, {"type": "Food Item", "hint": "Any food — different from your first one"}], "debrief": [{"emoji": "⏱️", "text": "<b>Real soft skill shown:</b> <b>Time management and working under pressure</b> — a kitchen during dinner service is one of the highest-pressure environments of any job. Everything has to happen simultaneously."}, {"emoji": "🤝", "text": "<b>Real teamwork skill:</b> A chef leads a team. Every dish that goes out is the result of multiple people coordinating. Poor communication = cold food and unhappy customers."}, {"emoji": "🎨", "text": "<b>Real creativity:</b> Chefs have to improvise constantly. An ingredient doesn't arrive? You adapt. A dish isn't working? You redesign it. Creativity is a job requirement, not a bonus."}, {"emoji": "💰", "text": "<b>Real salary:</b> Line cooks start around $30,000. Executive chefs at top restaurants can earn $80,000–$150,000. Owning your own restaurant is a whole other financial picture."}, {"emoji": "❓", "text": "<b>Discussion:</b> What part of being a chef surprised you? What would be the hardest part of this job for YOU personally?"}]}, "developer": {"name": "💻 Software Developer", "blanks": [{"type": "Adjective", "hint": "A word that describes something"}, {"type": "Plural Noun", "hint": "A thing you can have more than one of"}, {"type": "Verb ending in -ing", "hint": "An action word with -ing"}, {"type": "Number", "hint": "Any number"}, {"type": "Silly Word", "hint": "A made-up or funny word"}, {"type": "Adjective", "hint": "A word that describes something"}, {"type": "Animal", "hint": "Any animal"}, {"type": "Verb (past tense)", "hint": "Something that already happened"}, {"type": "Famous Person", "hint": "Anyone famous — real or fictional"}, {"type": "Exclamation", "hint": "Something you shout (e.g. YIKES, WAHOO, BLASTOFF)"}, {"type": "Noun", "hint": "A person, place, or thing"}, {"type": "Number", "hint": "Any number — pick a big one"}], "debrief": [{"emoji": "🔍", "text": "<b>Real soft skill shown:</b> <b>Problem-solving and persistence</b> — debugging code means hunting for one wrong character out of thousands of lines. It requires patience and systematic thinking."}, {"emoji": "💬", "text": "<b>Real communication skill:</b> Developers have to explain technical problems to non-technical people (managers, clients, designers). Translating code into plain English is a critical skill."}, {"emoji": "📚", "text": "<b>Real hard skill:</b> Coding languages like Python, JavaScript, and Java are tools — but learning how to think logically and break problems into steps is the real skill underneath them all."}, {"emoji": "💰", "text": "<b>Real salary:</b> Entry-level developers earn $65,000–$85,000. Senior developers at major companies can earn $150,000–$250,000+. Remote work is common in this field."}, {"emoji": "❓", "text": "<b>Discussion:</b> What surprised you about what a developer's day actually looks like? Is coding what you expected it to be?"}]}, "teacher": {"name": "📚 Teacher", "blanks": [{"type": "Adjective", "hint": "A word that describes something"}, {"type": "Plural Noun", "hint": "A thing you can have more than one of"}, {"type": "Subject in School", "hint": "Math, Science, English, History, etc."}, {"type": "Verb ending in -ing", "hint": "An action word with -ing"}, {"type": "Animal Sound", "hint": "The noise an animal makes"}, {"type": "Number", "hint": "Any number"}, {"type": "Adjective", "hint": "A word that describes something"}, {"type": "Famous Person", "hint": "Anyone famous — real or fictional"}, {"type": " ce and $150/month for gas. Cars are expensive. Some people choose to live near work to avoid this."}, {"name": "Car Insurance", "emoji": "🛡️", "category": "transport", "pctOfTakeHome": 4, "explain": "Car insurance averages $160–$200/month nationwide. This is your weekly share.", "reality": "Young drivers pay MORE — sometimes $300–$500/month. Your driving record and age affect this significantly."}, {"name": "Health Insurance", "emoji": "💊", "category": "health", "pctOfTakeHome": 7, "explain": "If your employer doesn't fully cover it, health insurance can cost $250–$400/month out of pocket.", "reality": "Without employer coverage, individual plans can cost $400–$600/month. This is one of the biggest hidden costs of adulthood."}, {"name": "Student Loans", "emoji": "🎓", "category": "debt", "pctOfTakeHome": 8, "explain": "The average student loan payment is $400–$500/month. This goes on for 10–20 years after graduation.", "reality": "Before your first paycheck, you might already owe $30,000–$100,000+. This expense affects every career that requires a 4-year degree."}, {"name": "Electricity & Utilities", "emoji": "💡", "category": "housing", "pctOfTakeHome": 3, "explain": "Electric, gas, water, and internet typically run $200–$350/month combined.", "reality": "Utilities aren't optional. In Wisconsin winters, heating alone can run $150–$200/month extra."}, {"name": "Phone Bill", "emoji": "📱", "category": "misc", "pctOfTakeHome": 2.5, "explain": "A smartphone plan runs $50–$100/month, or $12–$25/week.", "reality": "This seems small — but small expenses add up. $80/month × 12 = $960/year just to have a phone."}, {"name": "Eating Out / Food Delivery", "emoji": "🍔", "category": "food", "pctOfTakeHome": 5, "explain": "Americans spend an average of $250–$350/month eating out or ordering delivery.", "reality": "This is a flexible expense — you can cut it. But it takes discipline. Convenience costs money."}, {"name": "Clothing & Personal Care", "emoji": "👕", "category": "misc", "pctOfTakeHome": 3, "explain": "Adults spend roughly $100–$200/month on clothes, haircuts, toiletries, and personal items.", "reality": "Work clothes, shoes, and professional attire can be expensive — especially when starting a new job."}, {"name": "Entertainment & Subscriptions", "emoji": "📺", "category": "misc", "pctOfTakeHome": 3, "explain": "Netflix, Spotify, gym membership, video games — these small subscriptions add up to $100–$200/month.", "reality": "The average American pays for 4–5 subscriptions. Most people don't notice how much they add up until they look."}, {"name": "Savings", "emoji": "🏦", "category": "savings", "pctOfTakeHome": 10, "explain": "Financial experts recommend saving 10–20% of your take-home pay every month. This is the 10% version.", "reality": "Savings isn't spending — it's building a safety net. Without savings, one unexpected car repair or medical bill can cause financial crisis."}, {"name": "Emergency Fund", "emoji": "🚨", "category": "savings", "pctOfTakeHome": 5, "explain": "An emergency fund is 3–6 months of living expenses set aside for unexpected events. This is your weekly contribution.", "reality": "Most Americans can't cover a $400 emergency without going into debt. An emergency fund changes everything."}, {"name": "Medical / Dental Bills", "emoji": "🦷", "category": "health", "pctOfTakeHome": 2.5, "explain": "Even with insurance, out-of-pocket medical costs average $1,200–$2,000/year for healthy adults.", "reality": "One ER visit without good insurance can cost $1,500–$10,000. Dental work, glasses, and prescriptions aren't usually fully covered."}, {"name": "Gifts & Holidays", "emoji": "🎁", "category": "misc", "pctOfTakeHome": 2.5, "explain": "Birthdays, holidays, and weddings cost the average adult $1,000–$2,000/year in gifts and events.", "reality": "You can't avoid these unless you don't have people you care about. Social obligations cost real money."}, {"name": "Pet Care", "emoji": "🐕", "category": "misc", "pctOfTakeHome": 2.
